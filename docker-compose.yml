services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flotnix
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: flotnix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotnix -d flotnix"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
